<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: one calm reading column (max 1080px); claims appear as stitched "label tags", the one recurring motif. */
:root{
  --bg:#F6F1E4; --surface:#FDFAF2; --sunken:#EFE8D6;
  --ink:#23292A; --muted:#5A6360; --line:#DCD3BE;
  --green:#1F4D3A; --green-soft:#E2EADB; --on-green:#F9F5EA;
  --caution:#7A4E0E; --caution-soft:#F3E7CB;
  --bad:#8E3527; --bad-soft:#F4DFD8;
  --display:"Fraunces","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --body:"Instrument Sans","Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;
  --r-lg:22px; --r-md:14px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141A17; --surface:#1C2420; --sunken:#19201C;
    --ink:#ECE7DA; --muted:#A9B0A9; --line:#34413A;
    --green:#93C9A8; --green-soft:#22332A; --on-green:#0F1F18;
    --caution:#E3BA6C; --caution-soft:#352C1B;
    --bad:#EBA091; --bad-soft:#3A231E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141A17; --surface:#1C2420; --sunken:#19201C;
  --ink:#ECE7DA; --muted:#A9B0A9; --line:#34413A;
  --green:#93C9A8; --green-soft:#22332A; --on-green:#0F1F18;
  --caution:#E3BA6C; --caution-soft:#352C1B;
  --bad:#EBA091; --bad-soft:#3A231E;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
h1,h2,h3{font-family:var(--display);font-weight:500;line-height:1.15;text-wrap:balance;letter-spacing:-0.01em}
h1{font-size:clamp(2.1rem,6vw,3.4rem)}
h2{font-size:clamp(1.45rem,3.6vw,1.9rem)}
h3{font-size:1.2rem}
h1:focus{outline:none}
a{color:var(--green);text-underline-offset:3px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--green);outline-offset:3px;border-radius:6px}
svg.ic{width:1.15em;height:1.15em;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:16px;top:-60px;background:var(--green);color:var(--on-green);padding:10px 16px;border-radius:var(--r-sm);z-index:50}
.skip:focus{top:calc(env(safe-area-inset-top,0px) + 8px)}

.wrap{max-width:1080px;margin-inline:auto;padding-inline:20px}
.narrow{max-width:720px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:64px}
.mark{display:inline-flex;align-items:baseline;font-family:var(--display);font-size:1.45rem;font-weight:600;color:var(--ink);text-decoration:none;letter-spacing:-0.02em}
.mark span{color:var(--green);font-weight:400;font-style:italic}
.nav{display:flex;gap:4px}
.nav a{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;color:var(--muted);text-decoration:none;font-weight:500;font-size:.95rem}
.nav a:hover{color:var(--ink);background:var(--sunken)}
.nav a[aria-current="page"]{color:var(--green);background:var(--green-soft)}
.nav svg{display:none}
@media (max-width:760px){
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);justify-content:space-around;gap:0;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .nav a{flex:1;flex-direction:column;gap:2px;padding:6px 2px;font-size:.72rem;border-radius:12px;min-width:0}
  .nav svg{display:block;width:22px;height:22px}
  main{padding-bottom:84px}
  .top .wrap{min-height:56px}
}

main{display:block}
.page{padding-block:36px 64px;display:flex;flex-direction:column;gap:40px}
.lede{color:var(--muted);font-size:1.1rem;max-width:60ch}
.eyebrow{font-size:.78rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--green)}
.stack{display:flex;flex-direction:column;gap:14px}
.stack-lg{display:flex;flex-direction:column;gap:22px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* label tag: the signature */
.tag{display:inline-flex;align-items:center;gap:8px;padding:7px 15px;border-radius:999px;background:var(--surface);border:1.5px dashed var(--green);color:var(--green);font-weight:600;font-size:.92rem;line-height:1.3}
.tag::before{content:"";width:7px;height:7px;border-radius:50%;border:1.5px solid var(--green);flex:none}
.tag.big{font-family:var(--display);font-weight:500;font-size:clamp(1.7rem,5.4vw,2.7rem);padding:10px 26px 12px;letter-spacing:-0.01em;border-width:2px;border-radius:26px}
.tag.big::before{width:11px;height:11px;border-width:2px}

/* hero */
.hero{display:grid;gap:36px;align-items:center;padding-top:20px}
@media (min-width:900px){.hero{grid-template-columns:1.25fr .75fr}}
.hero h1 em{font-style:italic;color:var(--green);font-weight:400}
.pile{display:flex;flex-wrap:wrap;gap:12px;align-content:center}
.pile .tag:nth-child(odd){transform:rotate(-2.5deg)}
.pile .tag:nth-child(3n){transform:rotate(2deg)}
@media (max-width:899px){.pile{display:none}}

.search{position:relative}
.search label{display:block;font-weight:600;margin-bottom:8px}
.field{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:4px 6px 4px 16px}
.field:focus-within{border-color:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.field svg{color:var(--muted)}
.field input{flex:1;min-width:0;border:0;background:transparent;padding:13px 0;font-size:1.05rem;outline:none}
.field input::placeholder{color:var(--muted)}
.suggest{margin-top:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.suggest a{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 16px;text-decoration:none;color:var(--ink);border-top:1px solid var(--line)}
.suggest li:first-child a{border-top:0}
.suggest a:hover{background:var(--sunken)}
.suggest small{color:var(--muted)}
.empty{padding:22px;border:1.5px dashed var(--line);border-radius:var(--r-md);color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:flex-start}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:999px;border:1.5px solid var(--green);background:var(--green);color:var(--on-green);font-weight:600;text-decoration:none;line-height:1.2}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--green)}
.btn.ghost:hover{background:var(--green-soft);filter:none}
.btn.icon{padding:10px 14px;border-color:transparent;background:transparent;color:var(--muted)}
.btn.icon:hover{background:var(--sunken);color:var(--ink);filter:none}
.textlink{display:inline-flex;align-items:center;gap:6px;font-weight:600;text-decoration:none}
.textlink:hover{text-decoration:underline}

/* cards */
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))}
.card{display:flex;flex-direction:column;gap:12px;align-items:flex-start;height:100%;padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);text-decoration:none;color:var(--ink);transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--green);transform:translateY(-2px)}
.card p{color:var(--muted);font-size:.95rem;flex:1}
.card .more{display:inline-flex;align-items:center;gap:6px;color:var(--green);font-weight:600;font-size:.9rem}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}html{scroll-behavior:auto}}

.duo{display:grid;gap:14px}
@media (min-width:720px){.duo{grid-template-columns:1fr 1fr}}
.panel{padding:24px;border-radius:var(--r-lg);background:var(--green-soft);display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.panel p{color:var(--ink)}
.plain{padding:24px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 15px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:500;font-size:.92rem;display:inline-flex;gap:6px;align-items:center}
.chip:hover{border-color:var(--green)}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--on-green)}
.count{color:var(--muted);font-size:.92rem}
.grp{display:flex;flex-direction:column;gap:8px}
.grp-h{font-size:.78rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* detail */
.back{display:inline-flex;align-items:center;gap:6px;font-weight:600;text-decoration:none;align-self:flex-start}
.status{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:8px;background:var(--caution-soft);color:var(--caution);font-weight:600;font-size:.88rem}
.sec{display:flex;flex-direction:column;gap:14px;padding-top:28px;border-top:1px solid var(--line)}
.sec h2{display:flex;align-items:center;gap:12px}
.sec h2 svg{color:var(--green);width:1em;height:1em}
.prose{max-width:65ch}
.split{display:grid;gap:12px}
@media (min-width:720px){.split{grid-template-columns:1fr 1fr}}
.split > div{padding:18px;border-radius:var(--r-md);min-width:0}
.split .def{background:var(--sunken)}
.split .ev{background:var(--green-soft)}
.split strong{display:block;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.list{display:flex;flex-direction:column;gap:10px;max-width:65ch}
.list li{display:flex;gap:12px;align-items:flex-start}
.list li svg{margin-top:.28em}
.list.no svg{color:var(--caution)}
.list.q svg{color:var(--green)}
.src{display:flex;flex-direction:column;gap:10px}
.src li{padding:16px 18px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);display:flex;flex-direction:column;gap:6px;min-width:0}
.src .pub{color:var(--muted);font-size:.88rem}
.src p{font-size:.95rem}
.src a{overflow-wrap:anywhere;font-weight:600}
.badge{align-self:flex-start;font-size:.75rem;font-weight:600;letter-spacing:.04em;padding:3px 9px;border-radius:6px;background:var(--green-soft);color:var(--green)}
.badge.ph{background:var(--caution-soft);color:var(--caution)}
.note{padding:16px 18px;border-radius:var(--r-md);background:var(--sunken);color:var(--muted);font-size:.93rem;max-width:65ch}
.note strong{color:var(--ink)}

/* quiz */
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:clamp(20px,4vw,34px);display:flex;flex-direction:column;gap:20px}
.bar{display:flex;gap:6px}
.bar i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.bar i.on{background:var(--green)}
.stmt{font-family:var(--display);font-size:clamp(1.3rem,3.6vw,1.7rem);line-height:1.3}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;padding:14px 18px;border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--bg);font-weight:500}
.opt:not(:disabled):hover{border-color:var(--green)}
.opt:disabled{cursor:default;opacity:1}
.opt.right{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.opt small{font-weight:600;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.fb{padding:16px 18px;border-radius:var(--r-md);background:var(--green-soft)}
.fb.miss{background:var(--bad-soft)}
.fb strong{display:block;margin-bottom:4px}
.score{font-family:var(--display);font-size:clamp(3rem,12vw,5rem);line-height:1;color:var(--green);font-variant-numeric:tabular-nums}
.review li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.review svg{margin-top:.3em}
.review .ok{color:var(--green)} .review .ko{color:var(--bad)}

.decoded{display:flex;flex-direction:column;gap:12px}
.decoded > li{padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.decoded .gap{display:flex;gap:10px;color:var(--caution);font-size:.95rem}
.decoded .gap svg{margin-top:.25em}
textarea.copybox{width:100%;min-height:140px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);color:var(--ink);padding:12px;font:inherit;font-size:.9rem}
footer{border-top:1px solid var(--line);padding-block:24px;color:var(--muted);font-size:.88rem}
footer .wrap{display:flex;flex-direction:column;gap:6px}

/* ---- v4: decoder, notebook, learning ---- */
.mob-only{display:none}
.toplink{align-items:center;gap:6px;font-weight:600;text-decoration:none;font-size:.92rem;padding:6px 10px;border-radius:999px}
.toplink[aria-current="page"]{background:var(--green-soft)}
@media (max-width:760px){.nav a.desk-only{display:none}.mob-only{display:inline-flex}}
.stack-sm{display:flex;flex-direction:column;gap:6px}
a.eyebrow{text-decoration:none;align-self:flex-start}
a.eyebrow:hover{text-decoration:underline}
textarea.input{width:100%;min-height:130px;resize:vertical;border:1.5px solid var(--line);border-radius:18px;background:var(--surface);color:var(--ink);padding:14px 16px;font:inherit;line-height:1.5}
textarea.input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
textarea.input::placeholder{color:var(--muted)}
.btn.sm{padding:8px 15px;font-size:.92rem}
.btn[aria-pressed="true"] svg{fill:currentColor}
.seg{display:inline-flex;flex-wrap:wrap;align-self:flex-start;padding:4px;border-radius:999px;background:var(--sunken);gap:4px}
.seg button{border:0;background:transparent;padding:9px 18px;border-radius:999px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--green);box-shadow:0 0 0 1px var(--line)}
.lbl{font-size:.76rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.found{color:var(--muted);font-size:.88rem}
details.srcd summary{cursor:pointer;font-weight:600;color:var(--green);font-size:.92rem;padding-block:4px}
details.srcd[open] summary{margin-bottom:10px}
.photo{display:flex;flex-direction:column;gap:10px;padding:18px;border:1.5px dashed var(--line);border-radius:var(--r-md);align-items:flex-start}
.photo img{max-height:260px;border-radius:var(--r-sm);border:1px solid var(--line)}
.tile{display:flex;flex-direction:column;gap:12px;align-items:flex-start;padding:22px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);min-width:0}
.tile > .stats,.tile > .meter,.tile > .mrow,.tile > .rows,.tile > .mini{align-self:stretch}
ul.tile{gap:16px}
.rows{display:flex;flex-direction:column}
.urow{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 12px;padding:12px 0;border-top:1px solid var(--line)}
.urow span{min-width:0;overflow-wrap:anywhere}
.rowlink{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:baseline;padding:14px 2px;border-top:1px solid var(--line);text-decoration:none;color:var(--ink)}
.rowlink:hover .rn{color:var(--green)}
.rn{font-family:var(--display);font-size:1.2rem}
.rs{grid-column:1/-1;color:var(--muted);font-size:.93rem}
.letter{font-size:1.5rem;color:var(--green);padding-block:22px 8px;scroll-margin-top:84px}
.az{display:flex;flex-wrap:wrap;gap:6px}
.az button{min-width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.az button:hover{border-color:var(--green);color:var(--green)}
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr))}
.stat{padding:16px 18px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.tile .stat{background:var(--bg);padding:14px}
.tile .stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat b{font-family:var(--display);font-weight:500;font-size:2rem;line-height:1.1;color:var(--green);font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.9rem}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--green);border-radius:4px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:baseline}
.mrow .meter{grid-column:1/-1}
.badges{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}
.bdg{display:flex;gap:12px;align-items:flex-start;padding:16px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--sunken);color:var(--muted)}
.bdg.on{background:var(--green-soft);color:var(--ink);border-color:transparent}
.bdg svg{width:26px;height:26px;margin-top:2px}
.bdg.on svg{color:var(--green)}
.bdg strong{display:block}
.bdg small{font-size:.87rem}
.mini{display:flex;flex-direction:column}
.mini a{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);text-decoration:none;color:var(--ink);font-weight:500}
.mini li:first-child a{border-top:0}
.mini a:hover{color:var(--green)}
.clip{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line;overflow-wrap:anywhere}
.decoded > li{min-width:0}
footer a{font-weight:600}
.steps{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));counter-reset:st}
.steps li{counter-increment:st;display:flex;flex-direction:column;gap:4px;padding:18px 20px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line)}
.steps li::before{content:counter(st);font-family:var(--display);font-size:1.7rem;line-height:1;color:var(--green)}
.steps span{color:var(--muted);font-size:.95rem}
.mock{display:flex;flex-direction:column;gap:14px;align-items:flex-start;padding:22px;border:2px dashed var(--green);border-radius:var(--r-lg);background:var(--surface)}
.chip:disabled{cursor:default;opacity:1}
.reveal{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;align-self:stretch;text-align:left;border:0;background:transparent;padding:0}
.reveal[aria-expanded="true"] .more svg{transform:rotate(180deg)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.earned{display:flex;gap:12px;align-items:flex-start;margin-top:16px;padding:14px 16px;border-radius:var(--r-md);background:var(--green);color:var(--on-green)}
.earned > div{flex:1;min-width:0}
.earned > svg{width:24px;height:24px;margin-top:2px}
.earned a{color:inherit;font-weight:600}
.earned .btn.icon{color:inherit;padding:6px}
.earned .btn.icon:hover{background:transparent;color:inherit;opacity:.8}
</style>
